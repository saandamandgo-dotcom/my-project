
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.pres { width: 100%; }
.controls { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 12px 0; flex-wrap: wrap; }
.controls button { padding: 6px 14px; font-size: 13px; border-radius: 6px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
.controls button:hover { background: var(--color-background-secondary); }
.controls button.active { background: #1B4F8A; color: #fff; border-color: #1B4F8A; }
.slide-counter { font-size: 13px; color: var(--color-text-secondary); min-width: 60px; text-align: center; }
.slide { display: none; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; position: relative; }
.slide.active { display: block; }
.slide svg { width: 100%; height: 100%; display: block; }
.thumb-row { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
.thumb { flex: 0 0 100px; height: 56px; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
.thumb:hover { border-color: #0D9488; }
.thumb.active { border-color: #1B4F8A; }
.thumb svg { width: 100%; height: 100%; display: block; }
</style>

<div class="pres">
  <div class="thumb-row" id="thumbs"></div>
  <div id="slides"></div>
  <div class="controls">
    <button onclick="prev()">← Prev</button>
    <span class="slide-counter" id="counter">1 / 10</span>
    <button onclick="next()">Next →</button>
  </div>

let current = 0;

function render() {
  const container = document.getElementById('slides');
  const thumbs = document.getElementById('thumbs');
  container.innerHTML = '';
  thumbs.innerHTML = '';
  
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === current ? ' active' : '');
    div.innerHTML = s.svg;
    container.appendChild(div);
    
    const t = document.createElement('div');
    t.className = 'thumb' + (i === current ? ' active' : '');
    t.innerHTML = s.svg;
    t.onclick = () => { current = i; update(); };
    thumbs.appendChild(t);
  });
  document.getElementById('counter').textContent = `${current+1} / ${slides.length}`;
}

function update() {
  document.querySelectorAll('.slide').forEach((el, i) => {
    el.className = 'slide' + (i === current ? ' active' : '');
  });
  document.querySelectorAll('.thumb').forEach((el, i) => {
    el.className = 'thumb' + (i === current ? ' active' : '');
  });
  document.getElementById('counter').textContent = `${current+1} / ${slides.length}`;
  document.querySelector('.thumb.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function next() { current = (current + 1) % slides.length; update(); }
function prev() { current = (current - 1 + slides.length) % slides.length; update(); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

render();
</script>
